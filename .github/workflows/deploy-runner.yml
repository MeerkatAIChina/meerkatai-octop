name: Deploy to Aliyun ECS

# 自托管 Runner（装在 ECS 139.196.234.43 上，标签 meerkat-aliyun）就地构建镜像并重启容器。
# Runner 即目标机：无需镜像仓库、无需公网入口，也绕开 GitHub 托管 Runner 的账单限制。
#
# 依赖（一次性准备，见 docs）：
#   - .43 上的 Runner 服务（标签 meerkat-aliyun）
#   - .43 部署目录 /opt/octop-deploy（docker-compose.yml + .env）
#   - .43 数据目录 /opt/octop-data
on:
  push:
    branches: [meerkat]
  workflow_dispatch:

# 同一台机器串行部署，避免两次构建互相覆盖镜像 / 争抢端口。
concurrency:
  group: deploy-aliyun
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy on ECS
    # 自定义标签限定只在该 ECS 上运行。
    runs-on: [self-hosted, meerkat-aliyun]
    # 仅本仓库执行：fork 上没有该 Runner，否则任务会永久排队。
    if: github.repository == 'MeerkatAIChina/meerkatai-octop'
    timeout-minutes: 60
    env:
      OCTOP_PORT: ${{ vars.OCTOP_PORT || '8088' }}
      COMPOSE_FILE: /opt/octop-deploy/docker-compose.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          whoami
          docker version
          docker compose version

      - name: Build image
        # 就地构建（国内镜像加速）。产物留在本机，无需推送任何镜像仓库。
        run: |
          set -euo pipefail
          export DOCKER_BUILDKIT=1
          docker build \
            -f docker/Dockerfile \
            --build-arg NPM_REGISTRY=https://registry.npmmirror.com \
            --build-arg PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/ \
            --build-arg PIP_TRUSTED_HOST=mirrors.aliyun.com \
            --build-arg APT_MIRROR=mirrors.aliyun.com \
            --build-arg NODE_MAX_OLD_SPACE_SIZE=2048 \
            -t octop:meerkat .
          # 为本次提交留一个 SHA 标签，便于快速回滚。
          docker tag octop:meerkat "octop:sha-${GITHUB_SHA:0:12}"

      - name: Deploy
        run: |
          docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

      - name: Wait for health
        run: |
          set -euo pipefail
          port="${OCTOP_PORT:-8088}"
          for i in $(seq 1 36); do
            if curl -fsS "http://127.0.0.1:${port}/api/health" >/dev/null 2>&1; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::health check failed after 180s"
          docker compose -f "$COMPOSE_FILE" logs --tail=200
          exit 1
